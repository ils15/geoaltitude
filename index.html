<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenGeoaltitude | Altitudes com o geóide oficial</title>
    <meta name="description" content="Conversão de altitudes geométricas (h) em ortométricas (H) com o geóide oficial do IBGE e modelos globais abertos. UTM, datums, ITRF, DEM e serviços abertos — offline." />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23004a8e'/%3E%3Cpath%20d='M32%2012L40%2032L32%2052L24%2032Z'%20fill='white'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='4.5'%20fill='%23fdb913'/%3E%3C/svg%3E" />
    <script>
      // Anti-flash: aplica o tema salvo (ou o do sistema) antes do React montar
      (function () {
        try {
          var stored = localStorage.getItem('geoalt_theme');
          var dark = stored === 'dark' || ((stored === null || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
